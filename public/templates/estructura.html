<div
  x-data="{estructura: {} }"
  x-init="estructura = await $fetch(`https://www.morfologia-vegetal.info/estructuras/${$router.params.id}`)"
  @push-state.window="estructura = await $fetch(`https://www.morfologia-vegetal.info/estructuras/${$router.params.id}`)"
>
  <div class="page-header page-header-xs section-dark"
       :style="`background-image: url('https://www.morfologia-vegetal.info${estructura.imagen.formats.large.url}')`" >
    <div class="filter"></div>
    <div class="content-center">
      <div class="container">
        <div class="title-brand"><h1 x-text="estructura.nombre"></h1></div>
      </div>
    </div>
  </div>
  <nav  class="navbar navbar-expand-sm bg-dark d-none d-sm-block">
    <div  class="container">
      <div  >
        <a x-link href="/" class="text-white">Inicio</a> <i class="fa fa-chevron-right align-middle" ></i>
        <a class="text-white active"><b x-text="estructura.nombre"></b></a> <i class="fa fa-chevron-right align-middle" ></i>
        <div class="dropdown" style="display: inline">
          <a class="nav-link dropdown-toggle text-white pl-0" data-toggle="dropdown" style="cursor:pointer; display:inline;">Partes</a>
          <ul class="dropdown-menu ">
            <template x-for="subestructura in estructura.subestructuras">
              <li><a class="dropdown-item" x-link :href="`/subestructura/${subestructura.id}`" x-text="subestructura.nombre"></a></li>
            </template>
          </ul>
        </div>

      </div>
      <ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link">&nbsp;</a></li></ul>
    </div>
  </nav>
  <div class="section section-gray">
    <div class="container">
      <div class="nav-tabs-navigation">
        <div class="nav-tabs-wrapper">
          <ul id="tabs" class="nav nav-tabs" role="tablist">
            <li class="nav-item">
              <a class="nav-link active" data-toggle="tab" href="#descripcion" role="tab" aria-selected="true">Descripcion</a>
            </li>
            <template x-if="estructura.caracteristicas != null && estructura.caracteristicas.length > 0">
              <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#caracteristicas" role="tab" >Características</a>
              </li>
            </template>
            <template x-if="estructura.funciones != null && estructura.funciones.length > 0">
              <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#funciones" role="tab">Funciones</a>
              </li>
            </template>
            <template x-if="estructura.adaptaciones != null && estructura.adaptaciones.length > 0">
              <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#adaptaciones" role="tab">Adaptaciones</a>
              </li>
            </template>
            <template x-if="estructura.morfologias != null && estructura.morfologias.length > 0">
              <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#morfologias" role="tab">Tipos</a>
              </li>
            </template>
            <template x-if="estructura.galeria != null && estructura.galeria.length > 0">
              <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#galeria" role="tab">Imágenes</a>
              </li>
            </template>
          </ul>
        </div>
      </div>
      <div id="my-tab-content" class="tab-content text-left">
        <div class="tab-pane active" id="descripcion" role="tabpanel">
          <p x-markdown="estructura.descripcion"></p>
          <template x-for="seccion in estructura.secciones">
            <div>
              <div class="title"><h3 x-text="seccion.titulo"></h3></div>
              <p x-markdown="seccion.contenido"></p>

              <template x-for="subseccion in seccion.subsecciones">
                <div>
                  <h5 x-text="subseccion.titulo"></h5>
                  <p x-markdown="subseccion.contenido"></p>
                  <template x-for="imagen in subseccion.galeria">
                    <img :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`">
                  </template>
                </div>
              </template>

              <template x-for="imagen in seccion.galeria">
                <img  :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`">
              </template>
            </div>
          </template>
        </div>
        <div class="tab-pane" id="caracteristicas" role="tabpanel">
          <template x-for="caracteristica in estructura.caracteristicas">
            <div>
              <div class="title"><h5 x-text="caracteristica.nombre"></h5></div>
              <p x-markdown="caracteristica.descripcion"></p>
              <template x-for="imagen in caracteristica.galeria">
                <img  :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`">
              </template>
              <br/>
            </div>
          </template>
        </div>
        <div class="tab-pane" id="funciones" role="tabpanel">
          <template x-for="funcion in estructura.funciones">
            <div>
              <div class="title"><h5 x-text="funcion.nombre"></h5></div>
              <p x-markdown="funcion.descripcion"></p>
              <template x-for="imagen in funcion.galeria">
                <img  :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`">
              </template>
              <br/>
            </div>
          </template>
        </div>
        <div class="tab-pane" id="adaptaciones" role="tabpanel">
          <template x-for="adaptacion in estructura.adaptacions">
            <div>
              <div class="title"><h5 x-text="adaptacion.nombre"></h5></div>
              <p x-markdown="adaptacion.descripcion"></p>
              <template x-for="imagen in adaptacion.galeria">
                <img  :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`">
              </template>
              <br/>
            </div>
          </template>
        </div>
        <div class="tab-pane" id="morfologias" role="tabpanel">
          <template x-for="morfologia in estructura.morfologias">
            <div>
              <div class="title"><h5 x-text="morfologia.titulo"></h5></div>
              <p x-markdown="morfologia.descripcion"></p>
              <template x-for="imagen in morfologia.galeria">
                <img  :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`">
              </template>
              <br/>
            </div>
          </template>
        </div>
        <div class="tab-pane" id="galeria" role="tabpanel">
          <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
              <template x-for="(imagen, index) in estructura.galeria">
                <div :class="index === 0 ? 'carousel-item active' : 'carousel-item'">
                  <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.large.url}`" class="d-block img-fluid" src="https://www.morfologia-vegetal.info/uploads/thumbnail_Bryum_capillare_003_cf_1100_a58e3b9fe1.jpg">
                  <div class="carousel-caption d-none d-md-block">
                    <p x-text="imagen.caption">Ejemplares de musgos (Bryum capillare) con las dos generaciones visibles.</p>
                  </div>
                </div>
              </template>
            </div>
            <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="sr-only">Anterior</span>
            </a>
            <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="sr-only">Siguiente</span>
            </a>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
