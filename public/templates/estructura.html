<div
  x-data="{estructura: { galeria: [], cabecera: [] }, index: -1 }"
  x-init="estructura = await $fetch(`https://www.morfologia-vegetal.info/estructuras/${$router.params.id}`); index = Math.floor(Math.random() * estructura.cabecera.length)"
>
  <template x-if="estructura.nombre">
    <div>
      <div class="page-header page-header-xs section-dark"
           :style="`background-image: url('https://www.morfologia-vegetal.info${estructura.cabecera[index].url}')`" >
        <div class="filter"></div>
        <div class="content-center">
          <div class="container">
            <div class="title-brand"><h1 x-text="estructura.nombre"></h1></div>
          </div>
        </div>
      </div>
      <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container">
          <a class="navbar-brand" href="#" x-text="estructura.nombre"></a>
          <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse" data-target="#navbar-danger" aria-controls="navbarNav" aria-expanded="true" aria-label="Toggle navigation">
            <span class="navbar-toggler-bar"></span>
            <span class="navbar-toggler-bar"></span>
            <span class="navbar-toggler-bar"></span>
          </button>
          <div class="navbar-collapse collapse show" id="navbar-danger" style="">
            <ul class="navbar-nav ml-auto">
              <template x-if="estructura.subestructuras.length > 0">
                <div class="nav-item dropdown ">
                  <a class="nav-link dropdown-toggle" href="#pk" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true">Partes</a>
                  <ul class="dropdown-menu dropdown-menu-right dropdown-danger">
                    <template x-for="subestructura in estructura.subestructuras">
                      <li><a class="dropdown-item" x-link :href="`/subestructura/${subestructura.id}`" x-text="subestructura.nombre"></a></li>
                    </template>
                  </ul>
                </div>
              </template>
              <li class="nav-item">
                <a class="nav-link" data-toggle="tab" :href="'#descripcion'">Descripción</a>
              </li>
              <template x-if="estructura.caracteristicas != null && estructura.caracteristicas.length > 0">
                <div class="nav-item dropdown ">
                  <a class="nav-link dropdown-toggle" href="#pk" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true">Características</a>
                  <ul class="dropdown-menu dropdown-menu-right dropdown-danger">
                    <template x-for="caracteristica in estructura.caracteristicas">
                        <li><a class="dropdown-item" data-toggle="tab" :href="'#caracteristicas' + caracteristica.id" role="tab" x-text="caracteristica.nombre"></a></li>
                    </template>
                  </ul>
                </div>
              </template>
              <template x-if="estructura.funciones != null && estructura.funciones.length > 0">
                <li class="nav-item">
                  <a class="nav-link" data-toggle="tab" href="#funciones" role="tab">Funciones</a>
                </li>
              </template>
              <template x-if="estructura.adaptaciones != null && estructura.adaptaciones.length > 0">
                <li class="nav-item">
                  <a class="nav-link" data-toggle="tab" href="#adaptaciones" role="tab">Adaptaciones</a>
                </li>
              </template>
              <template x-if="estructura.tipos != null && estructura.tipos.length > 0">
                <div class="nav-item dropdown ">
                  <a class="nav-link dropdown-toggle" href="#pk" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true">Tipos</a>
                  <ul class="dropdown-menu dropdown-menu-right dropdown-danger">
                    <template x-for="morfologia in estructura.tipos">
                      <li><a class="dropdown-item" data-toggle="tab" :href="'#morfologias' + morfologia.id" role="tab" x-text="morfologia.titulo"></a></li>
                    </template>
                  </ul>
                </div>
              </template>
              \
            </ul>
          </div>
        </div>
      </nav>
      <div class="section-navigation section-gray pb-5">
        <div class="container">
          <div class="row pt-5" >
            <div class="col-md-3">
              <div x-init="$nextTick(() => $($el).find('.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                <template x-for="(imagen, index) in estructura.galeria" >
                  <a class="gallery-item" x-bind :href="'https://www.morfologia-vegetal.info' + (imagen.url)" :title="imagen.caption">
                    <img width="200" class="" x-bind :src="'https://www.morfologia-vegetal.info' + imagen.formats.medium.url" />
                  </a>
                </template>
              </div>
            </div>
            <div class="col-md-9">
              <div class="tab-content text-left">
                <div class="tab-pane active" id="descripcion" role="tabpanel">
                  <h2 class="mb-3 mt-0">Descripción</h2>
                  <p x-markdown="estructura.descripcion"></p>
                  <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: estructura.secciones }" ></x-component-wrapper>
                </div>
                <template x-for="(caracteristica, index) in estructura.caracteristicas">
                  <div class="tab-pane" x-bind:id="'caracteristicas' + caracteristica.id" role="tabpanel">
                    <h2 class="mb-3 mt-0" x-text="caracteristica.nombre"></h2>
                    <p x-markdown="caracteristica.descripcion"></p>
                    <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: caracteristica.secciones }" ></x-component-wrapper>
                    <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: caracteristica.galeria }" ></x-component-wrapper>
                  </div>
                </template>
                <template x-for="(adaptacion, index) in estructura.adaptaciones">
                  <div class="tab-pane" x-bind:id="'adaptaciones' + adaptacion.id" role="tabpanel">
                    <h2 class="mb-3 mt-0" x-text="adaptacion.titulo"></h2>
                    <p x-markdown="adaptacion.descripcion"></p>
                    <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: adaptacion.secciones }" ></x-component-wrapper>
                    <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: adaptacion.galeria }" ></x-component-wrapper>
                  </div>
                </template>
                <template x-for="(funcion, index) in estructura.funciones">
                  <div class="tab-pane" x-bind:id="'funciones' + funcion.id" role="tabpanel">
                    <h2 class="mb-3 mt-0" x-text="function.titulo"></h2>
                    <p x-markdown="funcion.description"></p>
                    <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: funcion.secciones }" ></x-component-wrapper>
                    <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: funcion.galeria }" ></x-component-wrapper>
                  </div>
                </template>
                <template x-for="(morfologia, index) in estructura.tipos">
                  <div class="tab-pane hidden" x-bind:id="'morfologias' + morfologia.id" role="tabpanel">
                    <h2 class="mb-3 mt-0" x-text="morfologia.titulo"></h2>
                    <p x-markdown="morfologia.descripcion"></p>
                    <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: morfologia.secciones }" ></x-component-wrapper>
                    <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: morfologia.galeria }" ></x-component-wrapper>
                    <div x-data="{ unaMorfologia: { subtipos: [] } }"
                         x-init="unaMorfologia = await $fetch(`https://www.morfologia-vegetal.info/morfologias/${morfologia.id}`);
                                            unaMorfologia.subtipos.sort((a, b) => { if(a.titulo < b.titulo) return -1; if(a.titulo > b.titulo) return 1; return 0; });">
                      <template x-for="subtipo in unaMorfologia.subtipos">
                        <div class="">
                          <h4 x-text="subtipo.titulo"></h4>
                          <p x-markdown="subtipo.description"></p>
                          <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: subtipo.secciones }" ></x-component-wrapper>
                          <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: subtipo.galeria }" ></x-component-wrapper>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </template>

</div>
