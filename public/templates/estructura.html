<div
  x-data="{estructura: { galeria: [], cabecera: [] }, index: -1 }"
  x-init="
  loading = true;
  estructura = (await $fetch(`https://familias-vegetales-gu7l.onrender.com/estructuras?nombre=${$router.params.id.replaceAll('-', ' ')}`))[0];
  index = Math.floor(Math.random() * estructura.cabecera.length);
  loading = false;"
>
  <template x-if="estructura.nombre" >
    <div x-data="{ activeTab:  'descripcion' }" x-head.title="'Familias Vegetales - ' + estructura.nombre">
      <div class="page-header page-header-xs section-dark"
           :style="`background-image: url('https://familias-vegetales-gu7l.onrender.com${estructura.cabecera[index].url}')`" >
        <div class="filter"></div>
        <div class="content-center">
          <div class="container">
            <div class="title-brand"><h1 x-text="estructura.nombre"></h1></div>
          </div>
        </div>
      </div>
      <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container">
          <a class="navbar-brand" href="#" x-text="estructura.nombre"></a>
          <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse" data-target="#navbar-danger" aria-controls="navbarNav" aria-expanded="true" aria-label="Toggle navigation">
            <span class="navbar-toggler-bar"></span>
            <span class="navbar-toggler-bar"></span>
            <span class="navbar-toggler-bar"></span>
          </button>
          <div class="navbar-collapse collapse show" id="navbar-danger" style="">
            <ul class="navbar-nav ml-auto">
              <li class="nav-item">
                <a class="nav-link" @click="activeTab = 'descripcion'" :class="{ 'active': activeTab === 'descripcion' }">Descripción</a>
              </li>
              <template x-if="estructura.subestructuras.length > 0">
                <div class="nav-item dropdown ">
                  <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true">Partes</a>
                  <ul class="dropdown-menu dropdown-menu-right">
                    <template x-for="subestructura in estructura.subestructuras">
                      <li><a class="dropdown-item" x-link :href="`/subestructura/${subestructura.nombre.replaceAll(' ' , '-')}`" x-text="subestructura.nombre"></a></li>
                    </template>
                  </ul>
                </div>
              </template>
              <template x-if="estructura.caracteristicas != null && estructura.caracteristicas.length > 0">
                <div class="nav-item dropdown ">
                  <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true" :class="{ 'active': activeTab.startsWith('caracteristica') }">
                    Características
                  </a>
                  <ul class="dropdown-menu dropdown-menu-right ">
                    <template x-for="caracteristica in estructura.caracteristicas">
                        <li><a class="dropdown-item" @click="activeTab = 'caracteristica' + caracteristica.id; $head('title', estructura.nombre + ' - ' + caracteristica.nombre)" :class="{ 'active': activeTab === 'caracteristica' + caracteristica.id' }" x-text="caracteristica.nombre"></a></li>
                    </template>
                  </ul>
                </div>
              </template>
              <template x-if="estructura.funciones != null && estructura.funciones.length > 0">
                <div class="nav-item dropdown ">
                  <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true" :class="{ 'active': activeTab.startsWith('funcion') }">Funciones</a>
                  <ul class="dropdown-menu dropdown-menu-right">
                    <template x-for="funcion in estructura.funciones">
                      <li><a class="dropdown-item" @click="activeTab = 'funcion' + funcion.id; $head('title', estructura.nombre + ' - ' + funcion.titulo)" :class="{ 'active': activeTab === 'funcion' + funcion.id }" x-text="funcion.titulo"></a></li>
                    </template>
                  </ul>
                </div>
              </template>
              <template x-if="estructura.adaptaciones != null && estructura.adaptaciones.length > 0">
                <div class="nav-item dropdown ">
                  <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true" :class="{ 'active': activeTab.startsWith('adaptaction') }">Adaptaciones</a>
                  <ul class="dropdown-menu dropdown-menu-right">
                    <template x-for="adaptacion in estructura.adaptaciones">
                      <li><a class="dropdown-item" @click="activeTab = 'adaptacion' + adaptacion.id; $head('title', estructura.nombre + ' - ' + adaptacion.titulo)" :class="{ 'active': activeTab === 'adaptacion' + adaptacion.id }" x-text="adaptacion.titulo"></a></li>
                    </template>
                  </ul>
                </div>
              </template>
              <template x-if="estructura.tipos != null && estructura.tipos.length > 0">
                <div class="nav-item dropdown ">
                  <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="true" :class="{ 'active': activeTab.startsWith('morfologia') }">Tipos</a>
                  <ul class="dropdown-menu dropdown-menu-right">
                    <template x-for="morfologia in estructura.tipos">
                      <li><a class="dropdown-item" @click="activeTab = 'morfologia' + morfologia.id; $head('title', estructura.nombre + ' - ' + morfologia.titulo)" :class="{ 'active': activeTab === 'morfologia' + morfologia.id' }" x-text="morfologia.titulo"></a></li>
                    </template>
                  </ul>
                </div>
              </template>
            </ul>
          </div>
        </div>
      </nav>
      <div class="pb-5">
          <div class="row" >
            <div class="col-md-12">
              <div class="tab-content text-left">
                <div class="tab-pane" id="descripcion" :class="{ 'active': activeTab === 'descripcion' }">
                  <div class="section section-gray">
                    <div class="container">
                      <p x-markdown="estructura.descripcion"></p>
                      <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: estructura.galeria }" ></x-component-wrapper>
                    </div>
                  </div>
                  <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: estructura.secciones, colored: true }" ></x-component-wrapper>
                </div>
                <template x-for="(caracteristica, index) in estructura.caracteristicas">
                  <div class="tab-pane" :class="{ 'active': activeTab === 'caracteristica' + caracteristica.id }">
                    <div class="section section-gray">
                      <div class="container">
                        <h2 class="mb-3 mt-0" x-text="caracteristica.nombre"></h2>
                        <p x-markdown="caracteristica.descripcion"></p>
                        <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: caracteristica.galeria }" ></x-component-wrapper>
                      </div>
                    </div>
                    <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: caracteristica.secciones, colored: true }" ></x-component-wrapper>
                  </div>
                </template>
                <template x-for="(adaptacion, index) in estructura.adaptaciones">
                  <div class="tab-pane" :class="{ 'active': activeTab === 'adaptacion' + adaptacion.id }">
                    <div class="section section-gray">
                      <div class="container">
                        <h2 class="mb-3 mt-0" x-text="adaptacion.titulo"></h2>
                        <p x-markdown="adaptacion.descripcion"></p>
                        <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: adaptacion.galeria }" ></x-component-wrapper>
                      </div>
                    </div>
                    <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: adaptacion.secciones, colored: true }" ></x-component-wrapper>
                  </div>
                </template>
                <template x-for="(funcion, index) in estructura.funciones">
                  <div class="tab-pane" :class="{ 'active': activeTab === 'funcion' + funcion.id }">
                    <div class="section section-gray">
                      <div class="container">
                        <h2 class="mb-3 mt-0" x-text="funcion.titulo"></h2>
                        <p x-markdown="funcion.description"></p>
                        <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: funcion.galeria }" ></x-component-wrapper>
                      </div>
                    </div>
                    <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: funcion.secciones, colored: true }" ></x-component-wrapper>
                  </div>
                </template>
                <template x-for="(morfologia, index) in estructura.tipos">
                  <div class="tab-pane hidden" :class="{ 'active': activeTab === 'morfologia' + morfologia.id }">
                    <div class="section section-gray">
                      <div class="container">
                        <h2 class="mb-3 mt-0" x-text="morfologia.titulo"></h2>
                        <p x-markdown="morfologia.descripcion"></p>
                        <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: morfologia.galeria }" ></x-component-wrapper>
                      </div>
                    </div>
                    <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: morfologia.secciones, colored: true }" ></x-component-wrapper>
                    <div x-data="{ unaMorfologia: { subtipos: [] } }"
                         x-init="unaMorfologia = await $fetch(`https://familias-vegetales-gu7l.onrender.com/morfologias/${morfologia.id}`);
                                            unaMorfologia.subtipos.sort((a, b) => { if(a.titulo < b.titulo) return -1; if(a.titulo > b.titulo) return 1; return 0; });">
                      <template x-for="(subtipo, index) in unaMorfologia.subtipos">
                        <div :class="{'section': true,
                          'section-brown': index % 4 == 0,
                          'section-dark-blue': index % 4 == 1,
                          'section-gold': index % 4 == 2,
                          'section-gray': index % 4 == 3 }">
                          <div class="container">
                            <h3 x-text="subtipo.titulo"></h3>
                            <p x-markdown="subtipo.description"></p>
                            <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: subtipo.secciones, colored: false }" ></x-component-wrapper>
                            <x-component-wrapper x-component url="/templates/components/galeria.html" x-data="{ galeria: subtipo.galeria }" ></x-component-wrapper>
                          </div>
                        </div>
                      </template>
                    </div>

                  </div>
                </template>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </template>
</div>
