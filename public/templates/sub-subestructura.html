<div
  x-data="{ subsubestructura: { galeria: [], cabecera: [] }, index: 0,
  subestructura : { cabecera: [] } }"
  x-init="subsubestructura = await $fetch(`https://www.morfologia-vegetal.info/sub-subestructuras/${$router.params.id}`);
  subestructura = await $fetch(`https://www.morfologia-vegetal.info/subestructuras/${subsubestructura.subestructura.id}`);
  index = Math.floor(Math.random() * subsubestructura.cabecera.length)"
  @route-loaded.window="subsubestructura = await $fetch(`https://www.morfologia-vegetal.info/sub-subestructuras/${$router.params.id}`);
  subestructura = await $fetch(`https://www.morfologia-vegetal.info/subestructuras/${subsubestructura.subestructura.id}`);
  index = Math.floor(Math.random() * subsubestructura.cabecera.length)"
>
  <template x-if="subsubestructura.nombre">
    <div>
      <div class="page-header page-header-xs section-dark"
           :style="`background-image: url('https://www.morfologia-vegetal.info${subsubestructura.cabecera[index].formats.large?.url ?? subsubestructura.cabecera[index].formats.medium?.url}')`" >
        <div class="filter"></div>
        <div class="content-center">
          <div class="container">
            <div class="title-brand"><h1 x-text="subsubestructura.nombre"></h1></div>
          </div>
        </div>
      </div>
      <nav  class="navbar navbar-expand-sm bg-dark d-none d-sm-block">
        <div  class="container">
          <div  >
            <a x-link href="/" class="text-white">Inicio</a> <i class="fa fa-chevron-right align-middle" ></i>
            <div class="dropdown" style="display: inline">
              <a class="nav-link dropdown-toggle text-white pl-0 pr-0" data-toggle="dropdown" style="cursor:pointer; display:inline;">
                <template x-for="unaEstructura in estructuras">
                  <template x-if="unaEstructura.id == subestructura.estructura.id">
                      <span x-text="unaEstructura.nombre"></span>
                  </template>
                </template>
              </a> <i class="fa fa-chevron-right align-middle" ></i>
              <ul class="dropdown-menu ">
                <template x-for="unaEstructura in estructuras">
                  <li><a class="dropdown-item" x-link :href="`/estructura/` + unaEstructura.id" x-text="unaEstructura.nombre"></a></li>
                </template>
              </ul>
            </div>
            <div class="dropdown" style="display: inline">
              <a class="nav-link dropdown-toggle text-white pl-0 pr-0" data-toggle="dropdown" style="cursor:pointer; display:inline;"><span x-text="subestructura.nombre"></span></a> <i class="fa fa-chevron-right align-middle" ></i>
              <ul class="dropdown-menu ">
                <template x-for="unaEstructura in estructuras">
                  <template x-if="unaEstructura.id == subestructura.estructura.id">
                    <template x-for="unaSubestructura in unaEstructura.subestructuras">
                      <li><a class="dropdown-item" x-link :href="`/subestructura/` + unaSubestructura.id" x-text="unaSubestructura.nombre"></a></li>
                    </template>
                  </template>
                </template>
              </ul>
            </div>
            <div class="dropdown" style="display: inline">
              <a class="nav-link dropdown-toggle text-white active pl-0 pr-0" data-toggle="dropdown" style="cursor:pointer; display:inline;"><b x-text="subsubestructura.nombre"></b></a>
              <template x-if="subestructura.sub_subestructuras.length > 1">
                <ul class="dropdown-menu ">
                  <template x-for="unaSubsubestructura in subestructura.sub_subestructuras">
                    <li><a class="dropdown-item" x-link :href="`/sub-subestructura/` + unaSubsubestructura.id" x-text="unaSubsubestructura.nombre"></a></li>
                  </template>
                </ul>
              </template>
            </div>

          </div>
          <ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link">&nbsp;</a></li></ul>
        </div>
      </nav>
      <div class="section section-gray">
        <div class="container">
          <div class="row">
            <div class="col-md-3">
              <div x-init="$nextTick(() => $($el).find('.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                <template x-for="(imagen, index) in subsubestructura.galeria" >
                  <a class="gallery-item" x-bind :href="'https://www.morfologia-vegetal.info' + (imagen.formats.large?.url ?? imagen.formats.medium?.url)" :title="imagen.caption">
                    <img width="200" style="max-height: 30vh" x-bind :src="'https://www.morfologia-vegetal.info' + imagen.formats.medium.url" />
                  </a>
                </template>
              </div>
            </div>
            <div class="col-md-9">
              <h2 class="title">Descripción</h2>
              <p x-markdown="subsubestructura.descripcion"></p>
              <template x-for="seccion in subsubestructura.secciones">
                <div>
                  <div class="title"><h3 x-text="seccion.titulo"></h3></div>
                  <p x-markdown="seccion.contenido"></p>

                  <template x-for="subseccion in seccion.subsecciones">
                    <div>
                      <h5 x-text="subseccion.titulo"></h5>
                      <p x-markdown="subseccion.contenido"></p>
                      <template x-if="subseccion.galeria != null && subseccion.galeria.length > 0">
                        <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                          <template x-for="imagen in subseccion.galeria">
                            <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${(imagen.formats.large?.url ?? imagen.formats.medium?.url)}`" :title="imagen.caption">
                              <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                            </a>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="seccion.galeria != null && seccion.galeria.length > 0">
                    <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                      <template x-for="imagen in seccion.galeria">
                        <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${(imagen.formats.large?.url ?? imagen.formats.medium?.url)}`" :title="imagen.caption">
                          <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                        </a>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="subsubestructura.caracteristicas != null && subsubestructura.caracteristicas.length > 0">
                <div>
                  <h2 class="title margin-top">
                    <div class="nav-item dropdown">
                      Características<a class="dropdown-toggle" data-toggle="dropdown" id="caracteristicasDropdownMenuButton" href="#pk" role="button" aria-haspopup="true" aria-expanded="false"></a>
                      <ul class="dropdown-menu dropdown-info" aria-labelledby="caracteristicasDropdownMenuButton">
                        <li class="dropdown-header">Características</li>
                        <template x-for="caracteristica in subsubestructura.caracteristicas">
                          <a class="dropdown-item" data-toggle="tab" :href="'#caracteristicas' + caracteristica.id" role="tab" x-text="caracteristica.nombre">Action</a>
                        </template>
                      </ul>
                    </div>
                  </h2>
                  <div class="tab-content text-left">
                    <template x-for="(caracteristica, index) in subsubestructura.caracteristicas">
                      <div class="tab-pane" :class="index == 0 ? 'active': ''" x-bind:id="'caracteristicas' + caracteristica.id" role="tabpanel">
                        <div class="title"><h3 x-text="caracteristica.nombre"></h3></div>
                        <p x-markdown="caracteristica.descripcion"></p>
                        <template x-if="caracteristica.galeria != null && caracteristica.galeria.length > 0">
                          <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                            <template x-for="imagen in caracteristica.galeria">
                              <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${(imagen.formats.large?.url ?? imagen.formats.medium?.url)}`" :title="imagen.caption">
                                <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="subsubestructura.funcions != null && subsubestructura.funcions.length > 0">
                <div>
                  <h2 class="title margin-top">
                    <div class="nav-item dropdown">
                      Funciones<a class="dropdown-toggle" data-toggle="dropdown" id="funcionesDropdownMenuButton" href="#pk" role="button" aria-haspopup="true" aria-expanded="false"></a>
                      <ul class="dropdown-menu dropdown-info" aria-labelledby="funcionesDropdownMenuButton">
                        <li class="dropdown-header">Funciones</li>
                        <template x-for="funcion in subsubestructura.funcions">
                          <a class="dropdown-item" data-toggle="tab" :href="'#funciones' + funcion.id" role="tab" x-text="funcion.titulo">Action</a>
                        </template>
                      </ul>
                    </div>
                  </h2>
                  <div  class="tab-content text-left">
                    <template x-for="(funcion, index) in subsubestructura.funcions">
                      <div class="tab-pane" :class="index == 0 ? 'active': ''" x-bind:id="'funciones' + funcion.id" role="tabpanel">
                        <div class="title"><h3 x-text="funcion.titulo"></h3></div>
                        <p x-markdown="funcion.description"></p>
                        <template x-if="funcion.galeria != null && funcion.galeria.length > 0">
                          <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                            <template x-for="imagen in funcion.galeria">
                              <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${(imagen.formats.large?.url ?? imagen.formats.medium?.url)}`" :title="imagen.caption">
                                <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="subsubestructura.adaptaciones != null && subsubestructura.adaptaciones.length > 0">
                <div>
                  <h2 class="title margin-top">
                    <div class="nav-item dropdown">
                      Adaptaciones<a class="dropdown-toggle" data-toggle="dropdown" id="adaptacionesDropdownMenuButton" href="#pk" role="button" aria-haspopup="true" aria-expanded="false"></a>
                      <ul class="dropdown-menu dropdown-info" aria-labelledby="adaptacionesDropdownMenuButton">
                        <li class="dropdown-header">Adaptaciones</li>
                        <template x-for="adaptacion in subsubestructura.adaptaciones">
                          <a class="dropdown-item" data-toggle="tab" :href="'#adaptaciones' + adaptacion.id" role="tab" x-text="adaptacion.titulo">Action</a>
                        </template>
                      </ul>
                    </div>
                  </h2>
                  <div class="tab-content text-left">
                    <template x-for="(adaptacion, index) in subsubestructura.adaptaciones">
                      <div class="tab-pane" :class="index == 0 ? 'active': ''" x-bind:id="'adaptaciones' + adaptacion.id" role="tabpanel">
                        <div class="title"><h3 x-text="adaptacion.titulo"></h3></div>
                        <p x-markdown="adaptacion.descripcion"></p>
                        <template x-if="adaptacion.galeria != null && adaptacion.galeria.length > 0">
                          <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                            <template x-for="imagen in adaptacion.galeria">
                              <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${(imagen.formats.large?.url ?? imagen.formats.medium?.url)}`" :title="imagen.caption">
                                <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="subsubestructura.morfologias != null && subsubestructura.morfologias.length > 0">
                <div>
                  <h2 class="title margin-top">
                    <div class="nav-item dropdown">
                      Tipos<a class="dropdown-toggle" data-toggle="dropdown" id="morfologiasDropdownMenuButton" href="#pk" role="button" aria-haspopup="true" aria-expanded="false"></a>
                      <ul class="dropdown-menu dropdown-info" aria-labelledby="morfologiasDropdownMenuButton">
                        <li class="dropdown-header">Tipos</li>
                        <template x-for="morfologia in subsubestructura.morfologias">
                          <a class="dropdown-item" data-toggle="tab" :href="'#morfologias' + morfologia.id" role="tab" x-text="morfologia.titulo">Action</a>
                        </template>
                      </ul>
                    </div>
                  </h2>
                  <div class="tab-content text-left">
                    <template x-for="(morfologia, index) in subsubestructura.morfologias">
                      <div class="tab-pane" :class="index == 0 ? 'active': ''" x-bind:id="'morfologias' + morfologia.id" role="tabpanel">
                        <div class="title"><h3 x-text="morfologia.titulo"></h3></div>
                        <p x-markdown="morfologia.descripcion"></p>
                        <template x-if="morfologia.galeria != null && morfologia.galeria.length > 0">
                          <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                            <template x-for="imagen in morfologia.galeria">
                              <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${(imagen.formats.large?.url ?? imagen.formats.medium?.url)}`" :title="imagen.caption">
                                <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

            </div>
          </div>

        </div>

      </div>
    </div>
  </template>

</div>
