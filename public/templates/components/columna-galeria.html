<body>
<div>
  <!-- BEGIN: Need to include all the styles in here -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,200" rel="stylesheet" />
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/assets/css/paper-kit.css"/>
  <link rel="stylesheet" href="/assets/css/styles.css"/>
  <link rel="stylesheet" href="/assets/css/magnific-popup.css"/>
  <!-- END : Need to include all the styles in here -->

  <template x-if="galeria != null && galeria.length > 0">
    <div x-init="$nextTick(() => $($el).find('.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen...', gallery:{ enabled:true } }))">
      <template x-for="(imagen, index) in galeria" >
        <template x-if="imagen.url">
          <a class="gallery-item" x-bind :href="'https://strapi.morfologiavegetal.info' + (imagen.url)" :title="imagen.caption">
            <img class="img-fluid" x-bind :src="'https://strapi.morfologiavegetal.info' + imagen.formats.medium.url" />
          </a>
        </template>
      </template>
    </div>
  </template>
</div>
</body>
