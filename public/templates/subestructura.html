<div
  x-data="{subestructura: { imagen: { formats: { medium: { url: ''}, thumbnail: {url: ''}, large: {url: ''} } } } }"
  x-init="subestructura = await $fetch(`https://www.morfologia-vegetal.info/subestructuras/${$router.params.id}`)"
  @push-state.window="subestructura = await $fetch(`https://www.morfologia-vegetal.info/subestructuras/${$router.params.id}`)"
>
  <template x-if="subestructura.nombre">
    <div>
      <div class="page-header page-header-xs section-dark"
           :style="`background-image: url('https://www.morfologia-vegetal.info${subestructura.imagen.formats.large.url}')`" >
        <div class="filter"></div>
        <div class="content-center">
          <div class="container">
            <div class="title-brand"><h1 x-text="subestructura.nombre"></h1></div>
          </div>
        </div>
      </div>
      <nav  class="navbar navbar-expand-sm bg-dark d-none d-sm-block">
        <div  class="container">
          <div  >
            <a x-link href="/" class="text-white">Inicio</a> <i class="fa fa-chevron-right align-middle" ></i>
            <a x-link x-bind:href="`/#/estructura/${subestructura.estructura.id}`" class="text-white" x-text="subestructura.estructura.nombre"></a> <i class="fa fa-chevron-right align-middle" ></i>
            <a class="text-white active"><b x-text="subestructura.nombre"></b></a><template x-if="subestructura.subsubestructuras.length > 0">  <i class="fa fa-chevron-right align-middle" ></i></template>
            <template x-if="subestructura.subsubestructuras.length > 0">
              <div class="dropdown" style="display: inline">
                <a class="nav-link dropdown-toggle text-white pl-0" data-toggle="dropdown" style="cursor:pointer; display:inline;">Partes</a>
                <ul class="dropdown-menu ">
                  <template x-for="subsubestructura in subestructura.subsubestructuras">
                    <li><a class="dropdown-item" x-link :href="`/subsubestructura/${subsubestructura.id}`" x-text="subsubestructura.nombre"></a></li>
                  </template>
                </ul>
              </div>
            </template>

          </div>
          <ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link">&nbsp;</a></li></ul>
        </div>
      </nav>
      <div class="section section-gray">
        <div class="container">
          <div class="row">
            <div class="col-sm-2">
              <div x-init="$nextTick(() => $('.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                <template x-for="(imagen, index) in subestructura.galeria" >
                  <a class="gallery-item" x-bind :href="'https://www.morfologia-vegetal.info' + imagen.formats.large.url" :title="imagen.caption">
                    <img width="100" style="max-height: 30vh" x-bind :src="'https://www.morfologia-vegetal.info' + imagen.formats.thumbnail.url" />
                  </a>
                </template>
              </div>
            </div>
            <div class="col-md-10">
              <h2 class="title">Descripción</h2>
              <p x-markdown="subestructura.descripcion"></p>
              <template x-for="seccion in subestructura.secciones">
                <div>
                  <div class="title"><h3 x-text="seccion.titulo"></h3></div>
                  <p x-markdown="seccion.contenido"></p>

                  <template x-for="subseccion in seccion.subsecciones">
                    <div>
                      <h5 x-text="subseccion.titulo"></h5>
                      <p x-markdown="subseccion.contenido"></p>
                      <template x-if="subseccion.galeria != null && subseccion.galeria.length > 0">
                        <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                          <template x-for="imagen in subseccion.galeria">
                            <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${imagen.formats.large.url}`" :title="imagen.caption">
                              <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                            </a>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="seccion.galeria != null && seccion.galeria.length > 0">
                    <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                      <template x-for="imagen in seccion.galeria">
                        <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${imagen.formats.large.url}`" :title="imagen.caption">
                          <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                        </a>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="subestructura.caracteristicas != null && subestructura.caracteristicas.length > 0">
                <div>
                  <h2 class="title margin-top">
                    <div class="nav-item dropdown">
                      Características<a class="dropdown-toggle" data-toggle="dropdown" id="caracteristicasDropdownMenuButton" href="#pk" role="button" aria-haspopup="true" aria-expanded="false"></a>
                      <ul class="dropdown-menu dropdown-info" aria-labelledby="caracteristicasDropdownMenuButton">
                        <li class="dropdown-header">Características</li>
                        <template x-for="caracteristica in subestructura.caracteristicas">
                          <a class="dropdown-item" data-toggle="tab" :href="'#caracteristicas' + caracteristica.id" role="tab" x-text="caracteristica.nombre">Action</a>
                        </template>
                      </ul>
                    </div>
                  </h2>
                  <div class="tab-content text-left">
                    <template x-for="(caracteristica, index) in subestructura.caracteristicas">
                      <div class="tab-pane" :class="index == 0 ? 'active': ''" x-bind:id="'caracteristicas' + caracteristica.id" role="tabpanel">
                        <div class="title"><h3 x-text="caracteristica.nombre"></h3></div>
                        <p x-markdown="caracteristica.descripcion"></p>
                        <template x-if="caracteristica.galeria != null && caracteristica.galeria.length > 0">
                          <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                            <template x-for="imagen in caracteristica.galeria">
                              <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${imagen.formats.large.url}`" :title="imagen.caption">
                                <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="subestructura.funcions != null && subestructura.funcions.length > 0">
                <div>
                  <h2 class="title margin-top">
                    <div class="nav-item dropdown">
                      Funciones<a class="dropdown-toggle" data-toggle="dropdown" id="funcionesDropdownMenuButton" href="#pk" role="button" aria-haspopup="true" aria-expanded="false"></a>
                      <ul class="dropdown-menu dropdown-info" aria-labelledby="funcionesDropdownMenuButton">
                        <li class="dropdown-header">Funciones</li>
                        <template x-for="funcion in subestructura.funcions">
                          <a class="dropdown-item" data-toggle="tab" :href="'#funciones' + funcion.id" role="tab" x-text="funcion.titulo">Action</a>
                        </template>
                      </ul>
                    </div>
                  </h2>
                  <div  class="tab-content text-left">
                    <template x-for="(funcion, index) in subestructura.funcions">
                      <div class="tab-pane" :class="index == 0 ? 'active': ''" x-bind:id="'funciones' + funcion.id" role="tabpanel">
                        <div class="title"><h3 x-text="funcion.titulo"></h3></div>
                        <p x-markdown="funcion.description"></p>
                        <template x-if="funcion.galeria != null && funcion.galeria.length > 0">
                          <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                            <template x-for="imagen in funcion.galeria">
                              <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${imagen.formats.large.url}`" :title="imagen.caption">
                                <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="subestructura.adaptaciones != null && subestructura.adaptaciones.length > 0">
                <div>
                  <h2 class="title margin-top">
                    <div class="nav-item dropdown">
                      Adaptaciones<a class="dropdown-toggle" data-toggle="dropdown" id="adaptacionesDropdownMenuButton" href="#pk" role="button" aria-haspopup="true" aria-expanded="false"></a>
                      <ul class="dropdown-menu dropdown-info" aria-labelledby="adaptacionesDropdownMenuButton">
                        <li class="dropdown-header">Adaptaciones</li>
                        <template x-for="adaptacion in subestructura.adaptaciones">
                          <a class="dropdown-item" data-toggle="tab" :href="'#adaptaciones' + adaptacion.id" role="tab" x-text="adaptacion.titulo">Action</a>
                        </template>
                      </ul>
                    </div>
                  </h2>
                  <div class="tab-content text-left">
                    <template x-for="(adaptacion, index) in subestructura.adaptaciones">
                      <div class="tab-pane" :class="index == 0 ? 'active': ''" x-bind:id="'adaptaciones' + adaptacion.id" role="tabpanel">
                        <div class="title"><h3 x-text="adaptacion.titulo"></h3></div>
                        <p x-markdown="adaptacion.descripcion"></p>
                        <template x-if="adaptacion.galeria != null && adaptacion.galeria.length > 0">
                          <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                            <template x-for="imagen in adaptacion.galeria">
                              <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${imagen.formats.large.url}`" :title="imagen.caption">
                                <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="subestructura.morfologias != null && subestructura.morfologias.length > 0">
                <div>
                  <h2 class="title margin-top">
                    <div class="nav-item dropdown">
                      Tipos<a class="dropdown-toggle" data-toggle="dropdown" id="morfologiasDropdownMenuButton" href="#pk" role="button" aria-haspopup="true" aria-expanded="false"></a>
                      <ul class="dropdown-menu dropdown-info" aria-labelledby="morfologiasDropdownMenuButton">
                        <li class="dropdown-header">Tipos</li>
                        <template x-for="morfologia in subestructura.morfologias">
                          <a class="dropdown-item" data-toggle="tab" :href="'#morfologias' + morfologia.id" role="tab" x-text="morfologia.titulo">Action</a>
                        </template>
                      </ul>
                    </div>
                  </h2>
                  <div class="tab-content text-left">
                    <template x-for="(morfologia, index) in subestructura.morfologias">
                      <div class="tab-pane" :class="index == 0 ? 'active': ''" x-bind:id="'morfologias' + morfologia.id" role="tabpanel">
                        <div class="title"><h3 x-text="morfologia.titulo"></h3></div>
                        <p x-markdown="morfologia.descripcion"></p>
                        <template x-if="morfologia.galeria != null && morfologia.galeria.length > 0">
                          <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                            <template x-for="imagen in morfologia.galeria">
                              <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${imagen.formats.large.url}`" :title="imagen.caption">
                                <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

            </div>
          </div>

        </div>

      </div>
    </div>
  </template>

</div>
