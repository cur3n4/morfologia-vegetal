
<div
  x-data="{adaptacion: { galeria: [], cabecera: [] }, index: -1 }"
  x-init="loading = true;
    adaptacion = (await $fetch(`https://strapi.morfologiavegetal.info/adaptacions?titulo=${$router.params.id.replaceAll('-', ' ')}`))[0];
    index = Math.floor(Math.random() * adaptacion.cabecera.length);
    loading = false;"

>
  <template x-if="adaptacion.titulo">
    <div x-head.title="'Morfología Vegetal - ' + adaptacion.titulo">
      <div class="page-header page-header-xs section-dark"
           :style="`background-image: url('https://strapi.morfologiavegetal.info${adaptacion.cabecera[index].url}')`" >
        <div class="filter"></div>
        <div class="content-center">
          <div class="container">
            <div class="title-brand"><h1 x-text="adaptacion.titulo"></h1></div>
          </div>
        </div>
      </div>
      <nav  class="navbar navbar-expand-sm bg-dark d-none d-sm-block">
        <div  class="container">
          <div  >
            <a x-link href="/" class="text-white">Inicio</a> <i class="fa fa-chevron-right align-middle text-secondary" ></i>
            <span class="text-white">Adaptaciones</span> <i class="fa fa-chevron-right align-middle text-secondary" ></i>
            <div class="dropdown" style="display: inline">
              <a class="nav-link dropdown-toggle text-white active pl-0 pr-0" data-toggle="dropdown" style="cursor:pointer; display:inline;"><b x-text="adaptacion.titulo"></b></a><template x-if="estructura.subestructuras.length > 0">  <i class="fa fa-chevron-right align-middle text-secondary" ></i></template>
              <ul class="dropdown-menu ">
                <template x-for="unaAdaptacion in adaptaciones">
                  <template x-if="unaAdaptacion.id != adaptacion.id">
                    <li><a class="dropdown-item" x-link :href="`/adaptacion/` + unaAdaptacion.id" x-text="unaAdaptacion.titulo"></a></li>
                  </template>
                </template>
              </ul>
            </div>
          </div>
          <ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link">&nbsp;</a></li></ul>
        </div>
      </nav>

      <div class="section section-gray">
        <div class="container">
          <div class="row">
            <div class="col-md-3" x-show="adaptacion.galeria.length > 0">
              <x-component-wrapper x-component url="/templates/components/columna-galeria.html" x-data="{ galeria: adaptacion.galeria }" ></x-component-wrapper>
            </div>
            <div :class="{'col-md-9': adaptacion.galeria.length > 0, 'col-md-12': adaptacion.galeria.length === 0 }">
              <p x-markdown="adaptacion.descripcion"></p>
              <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: adaptacion.secciones, colored: false }" ></x-component-wrapper>
            </div>
          </div>

        </div>
      </div>
    </div>
  </template>

</div>
