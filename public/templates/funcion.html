
<div
  x-data="{funcion: { galeria: [], cabecera: [] }, index: -1 }"
  x-init="funcion = await $fetch(`https://www.morfologia-vegetal.info/funcions/${$router.params.id}`); index = Math.floor(Math.random() * funcion.cabecera.length)"

>
  <template x-if="funcion.titulo">
    <div x-head.title="'Morfología Vegetal - ' + funcion.titulo">
      <div class="page-header page-header-xs section-dark"
           :style="`background-image: url('https://www.morfologia-vegetal.info${funcion.cabecera[index].url}')`" >
        <div class="filter"></div>
        <div class="content-center">
          <div class="container">
            <div class="title-brand"><h1 x-text="funcion.titulo"></h1></div>
          </div>
        </div>
      </div>
      <nav  class="navbar navbar-expand-sm bg-dark d-none d-sm-block">
        <div  class="container">
          <div  >
            <a x-link href="/" class="text-white">Inicio</a> <i class="fa fa-chevron-right align-middle text-secondary" ></i>
            <span class="text-white">Funciones</span> <i class="fa fa-chevron-right align-middle text-secondary" ></i>
            <div class="dropdown" style="display: inline">
              <a class="nav-link dropdown-toggle text-white active pl-0 pr-0" data-toggle="dropdown" style="cursor:pointer; display:inline;"><b x-text="funcion.titulo"></b></a><template x-if="estructura.subestructuras.length > 0">  <i class="fa fa-chevron-right align-middle text-secondary" ></i></template>
              <ul class="dropdown-menu ">
                <template x-for="unaFuncion in funciones">
                  <template x-if="unaFuncion.id != funcion.id">
                    <li><a class="dropdown-item" x-link :href="`/funcion/` + unaFuncion.id" x-text="unaFuncion.titulo"></a></li>
                  </template>
                </template>
              </ul>
            </div>
          </div>
          <ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link">&nbsp;</a></li></ul>
        </div>
      </nav>


      <div class="section section-gray">
        <div class="container">
          <div class="row">
            <div class="col-md-3" x-show="funcion.galeria.length > 0">
              <div x-init="$nextTick(() => $($el).find('.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen...', gallery:{ enabled:true } }))">
                <template x-for="(imagen, index) in funcion.galeria" >
                  <a class="gallery-item" x-bind :href="'https://www.morfologia-vegetal.info' + (imagen.url)" :title="imagen.caption">
                    <img class="img-fluid" x-bind :src="'https://www.morfologia-vegetal.info' + (imagen.formats.medium?.url ?? imagen.formats.thumbnail?.url)" />
                  </a>
                </template>
              </div>
            </div>
            <div :class="{'col-md-9': funcion.galeria.length > 0, 'col-md-12': funcion.galeria.length === 0 }">
              <p x-markdown="funcion.description"></p>
              <x-component-wrapper x-component url="/templates/components/secciones.html" x-data="{ secciones: funcion.secciones }" ></x-component-wrapper>
            </div>
          </div>

        </div>
      </div>
    </div>
  </template>

</div>
