
<div
  x-data="{contenido: { galeria: [], cabecera: [] }, index: 0 }"
  x-init="contenido = await $fetch(`https://www.morfologia-vegetal.info/contenidos/${$router.params.id}`); index = Math.floor(Math.random() * contenido.cabecera.length)"
  @route-loaded.window="contenido = await $fetch(`https://www.morfologia-vegetal.info/contenidos/${$router.params.id}`); index = Math.floor(Math.random() * contenido.cabecera.length)"
>
  <template x-if="contenido.titulo">
    <div>
      <div class="page-header page-header-xs section-dark"
           :style="`background-image: url('https://www.morfologia-vegetal.info${contenido.cabecera[index].formats.large?.url ?? contenido.cabecera[index].formats.medium?.url}')`" >
        <div class="filter"></div>
        <div class="content-center">
          <div class="container">
            <div class="title-brand"><h1 x-text="contenido.titulo"></h1></div>
          </div>
        </div>
      </div>

      <div class="section section-gray">
        <div class="container">
          <div class="row">
            <div class="col-sm-3">
              <div x-init="$nextTick(() => $($el).find('.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                <template x-for="(imagen, index) in contenido.galeria" >
                  <a class="gallery-item" x-bind :href="'https://www.morfologia-vegetal.info' + (imagen.formats.large?.url ?? imagen.formats.medium?.url)" :title="imagen.caption">
                    <img width="200" style="max-height: 90vh" class="" x-bind :src="'https://www.morfologia-vegetal.info' + imagen.formats.medium.url" />
                  </a>
                </template>
              </div>
            </div>
            <div class="col-sm-9">
              <div class="title"><h1 x-text="contenido.titulo"></h1></div>
              <p x-markdown="contenido.descripcion"></p>
              <template x-for="seccion in contenido.secciones">
                <div>
                  <div class="title"><h3 x-text="seccion.titulo"></h3></div>
                  <p x-markdown="seccion.contenido"></p>

                  <template x-for="subseccion in seccion.subsecciones">
                    <div>
                      <h5 x-text="subseccion.titulo"></h5>
                      <p x-markdown="subseccion.contenido"></p>
                      <template x-if="subseccion.galeria != null && subseccion.galeria.length > 0">
                        <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                          <template x-for="imagen in subseccion.galeria">
                            <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${(imagen.formats.large?.url ?? imagen.formats.medium?.url)}`" :title="imagen.caption">
                              <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.thumbnail.url}`" />
                            </a>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="seccion.galeria != null && seccion.galeria.length > 0">
                    <div x-init="$nextTick(() => $($el).find('a.gallery-item').magnificPopup({ type: 'image', tLoading: 'Cargando imagen #%curr%...', gallery:{ enabled:true } }))">
                      <template x-for="imagen in seccion.galeria">
                        <a class="gallery-item" x-bind :href="`https://www.morfologia-vegetal.info${(imagen.formats.large?.url ?? imagen.formats.medium?.url)}`" :title="imagen.caption">
                          <img x-bind :src="`https://www.morfologia-vegetal.info${imagen.formats.medium.url}`" />
                        </a>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>

        </div>
      </div>
    </div>
  </template>

</div>
