<html>
<head>
  <script>
    if (!window.location.hash) {
      window.location = window.location + '#/'
    }
  </script>
  <title >Morfología Vegetal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/htmx.org"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script src="./assets/js/alpine-marked.js" defer></script>
  <script src="./assets/js/alpine-fetch.js" defer></script>
  <script src="./assets/js/alpine-route.js" defer></script>
  <script src="/assets/js/alpine-component.js" defer></script>
  <script src="//unpkg.com/alpinejs-head/dist/head.min.js" defer></script>
  <script src="//unpkg.com/alpinejs" defer></script>


  <!--     Fonts and icons     -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:500,800,300" rel="stylesheet" />
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/assets/css/paper-kit.css"/>
  <link rel="stylesheet" href="/assets/css/styles.css"/>
  <link rel="stylesheet" href="/assets/css/magnific-popup.css"/>

  <!--   Core JS Files   -->
  <script src="./assets/js/core/jquery.min.js" type="text/javascript"></script>
  <script src="./assets/js/core/popper.min.js" type="text/javascript"></script>
  <script src="./assets/js/core/bootstrap.min.js" type="text/javascript"></script>

  <script src="assets/js/core/jquery.magnific-popup.min.js"></script>

  <!-- Control Center for Paper Kit: parallax effects, scripts for the example pages etc -->
  <script src="./assets/js/paper-kit.min.js" type="text/javascript"></script>

</head>
<body class="index-page sidebar-collapse"
      x-data="{contenidos: {}, estructuras: {}, funciones: {}, adaptaciones: {}, loading: false}"
      x-init="loading = true; $router.config({ mode: 'hash' });
        contenidos = await $fetch(`https://www.morfologia-vegetal.info/contenidos?_sort=orden:ASC`);
        estructuras = await $fetch(`https://www.morfologia-vegetal.info/estructuras?_sort=orden:ASC`);
        funciones = await $fetch(`https://www.morfologia-vegetal.info/funcions?_sort=orden:ASC`);
        adaptaciones = await $fetch(`https://www.morfologia-vegetal.info/adaptacions?_sort=orden:ASC`);
        loading = false;">

  <template x-if="loading">
    <div class="spinner-overlay"><div class="spinner-spin"><div class="bounce1"></div><div class="bounce2"></div><div class="bounce3"></div></div></div>
  </template>

  <nav class="navbar navbar-expand-lg fixed-top navbar-transparent" color-on-scroll="100">
    <div class="container-fluid">
      <div class="navbar-translate">
        <a x-link class="navbar-brand" href="/" rel="tooltip" title="Coded by Creative Tim" data-placement="bottom" target="_blank">
          Morfología Vegetal
        </a>
        <button class="navbar-toggler navbar-toggler" type="button" data-toggle="collapse" data-target="#navigation" aria-controls="navigation-index" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-bar bar1"></span>
          <span class="navbar-toggler-bar bar2"></span>
          <span class="navbar-toggler-bar bar3"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse justify-content-end" id="navigation">
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" data-toggle="dropdown" href="#pk" role="button" aria-haspopup="true" aria-expanded="false">Estructuras</a>
            <ul class="dropdown-menu">
              <template x-for="estructura in estructuras">
                <a class="dropdown-item" x-link :href="'/estructura/' + estructura.id" x-text="estructura.nombre"></a>
              </template>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" data-toggle="dropdown" href="#pk" role="button" aria-haspopup="true" aria-expanded="false">Adaptaciones</a>
            <ul class="dropdown-menu">
              <template x-for="adaptacion in adaptaciones">
                <a class="dropdown-item" x-link :href="'/adaptacion/' + adaptacion.id" x-text="adaptacion.titulo"></a>
              </template>
            </ul>
          </li>
          <template x-for="contenido in contenidos">
            <template x-if="contenido.id != 1 && contenido.id != 7">
              <li class="nav-item">
                <a x-link x-bind:href="`/contenido/${contenido.id}`" class="nav-link" x-text="contenido.titulo"></a>
              </li>
            </template>
          </template>
        </ul>
      </div>
    </div>
  </nav>

  <div class="main">
    <template x-route="/" template.preload="/templates/home.html"></template>
    <template x-route="/estructura/:id" template.preload="/templates/estructura.html"></template>
    <template x-route="/funcion/:id" template.preload="/templates/funcion.html"></template>
    <template x-route="/adaptacion/:id" template.preload="/templates/adaptacion.html"></template>
    <template x-route="/subestructura/:id" template.preload="/templates/subestructura.html"></template>
    <template x-route="/sub-subestructura/:id" template.preload="/templates/sub-subestructura.html"></template>
    <template x-route="/contenido/:id" template.preload="/templates/contenido.html"></template>
    <template x-route.notfound>
      <div>Página no encontrada</div>
    </template>

  </div>

  <footer class="footer" >
    <div class="container-fluid">
      <div class="row">
        <div class="credits ml-auto">
            <span class="copyright">
                &copy; Fotos, contenido y diseño Morfología Vegetal 2022
            </span>
        </div>
      </div>
    </div>
  </footer>


</body>
</html>
