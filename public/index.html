<html>
<head>
  <script src="https://unpkg.com/mustache@latest"></script>
  <script src="https://unpkg.com/htmx.org"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/client-side-templates.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!--     Fonts and icons     -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,200" rel="stylesheet" />
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/assets/css/paper-kit.min.css"/>

  <!--   Core JS Files   -->
  <script src="./assets/js/core/jquery.min.js" type="text/javascript"></script>
  <script src="./assets/js/core/popper.min.js" type="text/javascript"></script>
  <script src="./assets/js/core/bootstrap.min.js" type="text/javascript"></script>

  <!--  Plugin for Switches, full documentation here: http://www.jque.re/plugins/version3/bootstrap.switch/ -->
  <script src="./assets/js/plugins/bootstrap-switch.js"></script>

  <!--  Plugin for the Sliders, full documentation here: http://refreshless.com/nouislider/ -->
  <script src="./assets/js/plugins/nouislider.min.js" type="text/javascript"></script>

  <!--  Plugin for the DatePicker, full documentation here: https://github.com/uxsolutions/bootstrap-datepicker -->
  <!--<script src="./assets/js/plugins/moment.min.js"></script>
  <script src="./assets/js/plugins/bootstrap-datepicker.js" type="text/javascript"></script>-->

  <!--  Google Maps Plugin    -->
  <!--<script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key=YOUR_KEY_HERE"></script>-->

  <!-- Control Center for Paper Kit: parallax effects, scripts for the example pages etc -->
  <script src="./assets/js/paper-kit.min.js" type="text/javascript"></script>


  <script>
    // Remove unnecessary headers
    document.addEventListener('htmx:configRequest', (evt) => {
      evt.detail.headers = [];
    });

    function md(text, subrender) {
      return marked.parse(subrender(text))
    }

    let Context = Mustache.Context
    Context.prototype._lookup = Context.prototype.lookup
    Context.prototype.lookup = function mdLoopup(name) {
      return name === 'md' ? md : this._lookup(name);
    }
  </script>
</head>
<body class="index-page sidebar-collapse">
  <nav class="navbar navbar-expand-lg fixed-top navbar-transparent" color-on-scroll="300">
    <div class="container">
      <div class="navbar-translate">
        <a class="navbar-brand" href="#" rel="tooltip" title="Coded by Creative Tim" data-placement="bottom" target="_blank">
          Morfología Vegetal
        </a>
        <button class="navbar-toggler navbar-toggler" type="button" data-toggle="collapse" data-target="#navigation" aria-controls="navigation-index" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-bar bar1"></span>
          <span class="navbar-toggler-bar bar2"></span>
          <span class="navbar-toggler-bar bar3"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse justify-content-end" id="navigation">
        <ul class="navbar-nav" id="contenidosContent">
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-header section-dark" style="background-image: url('./assets/img/antoine-barres.jpg')">
    <div class="filter"></div>
    <div class="content-center">
      <div class="container">
        <div class="title-brand">
          <h1 class="presentation-title">Morfología Vegetal</h1>
        </div>
        <h2 class="presentation-subtitle text-center">La página de la morfología vegetal! </h2>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="container">
      <div id="estructurasContent"></div>
    </div>

    <div hx-ext="client-side-templates">
      <div hx-get="https://www.morfologia-vegetal.info/estructuras"
           hx-trigger="load"
           hx-swap="innerHTML"
           hx-target="#estructurasContent"
           mustache-template="estructuras">
      </div>
      <div hx-get="https://www.morfologia-vegetal.info/contenidos"
           hx-trigger="load"
           hx-swap="innerHTML"
           hx-target="#contenidosContent"
           mustache-template="contenidos">
      </div>
    </div>
  </div>

  <template id="contenidos">
    {{#.}}
    <li class="nav-item">
      <a href="#" target="_blank" class="nav-link">{{titulo}}</a>
    </li>
    {{/.}}
  </template>

  <template id="estructuras">
    {{#.}}
    <div class="section">
      <h1>{{nombre}}</h1>
      <p>{{#md}}{{descripcion}}{{/md}}</p>

      {{#secciones.length}}
        {{#secciones}}
        <h3>{{titulo}}</h3>
        <p>{{contenido}}</p>

        {{#subsecciones}}
        <h5>{{titulo}}</h5>
        <p>{{#md}}{{contenido}}{{/md}}</p>
        {{/subsecciones}}

        {{#galeria}}
        <img src="https://www.morfologia-vegetal.info{{formats.thumbnail.url}}">
        {{/galeria}}
        {{/secciones}}
      {{/secciones.length}}

      {{#galeria.length}}
        <h4>Galeria</h4>
        {{#galeria}}
        <img src="https://www.morfologia-vegetal.info{{formats.thumbnail.url}}">
        {{/galeria}}
      {{/galeria.length}}

      {{#subestructuras.length}}
        <h4>Subestructuras</h4>
        {{#subestructuras}}
          <h5>{{nombre}}</h5>
          <p>{{#md}}{{descripcion}}{{/md}}</p>
          {{#galeria}}
          <img src="https://www.morfologia-vegetal.info{{formats.thumbnail.url}}">
          {{/galeria}}
        {{/subestructuras}}
      {{/subestructuras.length}}
    </div>
    {{/.}}
  </template>
</body>
</html>
