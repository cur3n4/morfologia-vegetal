<html>
<head>
  <script src="https://unpkg.com/mustache@latest"></script>
  <script src="https://unpkg.com/htmx.org"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/client-side-templates.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/assets/css/paper-kit.min.css"/>
  <script>
    // Remove unnecessary headers
    document.addEventListener('htmx:configRequest', (evt) => {
      evt.detail.headers = [];
    });

    function md(text, subrender) {
      return marked.parse(subrender(text))
    }

    let Context = Mustache.Context
    Context.prototype._lookup = Context.prototype.lookup
    Context.prototype.lookup = function mdLoopup(name) {
      return name === 'md' ? md : this._lookup(name);
    }
  </script>
</head>
<body class="index-page sidebar-collapse">
  <nav class="navbar navbar-expand-lg fixed-top navbar-transparent" color-on-scroll="300">
    <div class="container">
      <div class="navbar-translate">

          Morfología Vegetal

          <span class="navbar-toggler-bar bar1"></span>
          <span class="navbar-toggler-bar bar2"></span>
          <span class="navbar-toggler-bar bar3"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse justify-content-end" id="navigation">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" rel="tooltip" title="Follow us on Twitter" data-placement="bottom" href="https://twitter.com/CreativeTim" target="_blank">

            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" rel="tooltip" title="Like us on Facebook" data-placement="bottom" href="https://www.facebook.com/CreativeTim" target="_blank">
              <i class="fa fa-facebook-square"></i>
              <p class="d-lg-none">Facebook</p>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" rel="tooltip" title="Follow us on Instagram" data-placement="bottom" href="https://www.instagram.com/CreativeTimOfficial" target="_blank">
              <i class="fa fa-instagram"></i>
              <p class="d-lg-none">Instagram</p>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" rel="tooltip" title="Star on GitHub" data-placement="bottom" href="https://www.github.com/CreativeTimOfficial/paper-kit" target="_blank">
              <i class="fa fa-github"></i>

          <li class="nav-item">
            <a href="https://demos.creative-tim.com/paper-kit-2/docs/1.0/getting-started/introduction.html" target="_blank" class="nav-link"><i class="nc-icon nc-book-bookmark"></i> Documentation</a>

        </ul>
      </div>
    </div>
  </nav>

  <div class="page-header section-dark" style="background-image: url('./assets/img/antoine-barres.jpg')">
    <div class="filter"></div>
    <div class="content-center">
      <div class="container">
        <div class="title-brand">
          <h1 class="presentation-title">Morfología Vegetal</h1>
          <div class="fog-low">
            <img src="./assets/img/fog-low.png" alt="">
          </div>
          <div class="fog-low right">
            <img src="./assets/img/fog-low.png" alt="">
          </div>
        </div>
        <h2 class="presentation-subtitle text-center">Make your mark with a Free Bootstrap 4 UI Kit! </h2>
      </div>
    </div>
    <div class="moving-clouds" style="background-image: url('./assets/img/clouds.png'); "></div>
  </div>
  <div class="main">
    <div class="container">
      <div id="content"></div>
    </div>

    <div hx-ext="client-side-templates">
      <div hx-get="https://www.morfologia-vegetal.info/estructuras"
           hx-trigger="load"
           hx-swap="innerHTML"
           hx-target="#content"
           mustache-template="estructuras">
      </div>
    </div>
  </div>

  <template id="estructuras">
    {{#.}}
    <div class="section">
      <h1>{{nombre}}</h1>
      <p>{{#md}}{{descripcion}}{{/md}}</p>

      <h4>Secciones</h4>

      {{#secciones}}
      <h3>{{titulo}}</h3>
      <p>{{contenido}}</p>

      {{#subsecciones}}
      <h5>{{titulo}}</h5>
      <p>{{contenido}}</p>
      {{/subsecciones}}

      {{#galeria}}
      <img src="https://www.morfologia-vegetal.info{{formats.thumbnail.url}}">
      {{/galeria}}
      {{/secciones}}


      <h4>Galeria</h4>
      {{#galeria}}
      <img src="https://www.morfologia-vegetal.info{{formats.thumbnail.url}}">
      {{/galeria}}
    </div>
    {{/.}}
  </template>
</body>
</html>
